version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install pytest boto3 moto

  build:
    commands:
      - echo "Running unit tests..."
      - cd project-d-serverless-api
      - python -m pytest tests/ -v
      - cd ..

  post_build:
    commands:
      - echo "Publishing new Lambda version..."
      - aws lambda publish-version --function-name project-d-api --query 'Version' --output text > /tmp/new_version.txt
      - NEW_VERSION=$(cat /tmp/new_version.txt)
      - echo "New version is $NEW_VERSION"
      - CURRENT_VERSION=$(aws lambda list-aliases --function-name project-d-api --query 'Aliases[?Name==`live`].FunctionVersion' --output text)
      - echo "Current version is $CURRENT_VERSION"
      - sed -i "s/<CURRENT_VERSION>/$CURRENT_VERSION/g" appspec.yml
      - sed -i "s/<TARGET_VERSION>/$NEW_VERSION/g" appspec.yml
      - APPSPEC_CONTENT=$(python3 -c 'import json; print(json.dumps(open("appspec.yml").read()))')
      - aws deploy create-deployment --application-name project-d-deploy --deployment-group-name project-d-deployment-group --revision "revisionType=AppSpecContent,appSpecContent={content=$APPSPEC_CONTENT}"

artifacts:
  files:
    - appspec.yml
    - project-d-serverless-api/lambda/index.py
  discard-paths: no